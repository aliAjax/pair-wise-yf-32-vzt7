<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>器官分配协调台</title>
<style>body{font:15px system-ui;max-width:1080px;margin:40px auto;background:#f5f7fb;padding:0 20px;color:#172033}section{background:white;padding:20px;border-radius:12px;box-shadow:0 2px 12px #0001}pre{background:#0f172a;color:#86efac;padding:16px;overflow:auto;border-radius:8px}input,button{font:inherit;padding:8px;margin:4px}button{background:#be123c;color:white;border:0;border-radius:6px}table{border-collapse:collapse;width:100%;margin:12px 0}th,td{border:1px solid #e2e8f0;padding:6px 10px;text-align:left;font-size:14px}th{background:#f1f5f9}</style>
<h1>器官分配协调台</h1><p>查看当前可用器官、候选患者和分配进度。提出分配时可写明应答截止时间；接收医院逾期未确认时，协调员或分配员刷新本页即按原排序顺延给下一位仍符合条件且未拒绝过本次分配的患者。写操作通过 JSON API 完成，医院接口需携带 X-Hospital。</p><section><input id="u" value="allocator"><input id="r" value="allocation_officer"><button onclick="load()">刷新</button><table><thead><tr><th>分配ID</th><th>状态</th><th>当前医院</th><th>顺延次数</th><th>应答截止</th><th>更新时间</th></tr></thead><tbody id="t"></tbody></table><pre id="o"></pre></section><script>async function load(){let resp=await fetch('/api/state',{headers:{'X-User-Id':u.value,'X-Role':r.value}});let data=await resp.json();o.textContent=JSON.stringify(data,null,2);t.innerHTML='';for(let a of(data.allocations||[])){let tr=document.createElement('tr');for(let v of[a.id,a.status,a.current_hospital||'',a.deferral_count??'',a.response_deadline||'—',a.updated_at||'']){let td=document.createElement('td');td.textContent=v;tr.appendChild(td)}t.appendChild(tr)}}load()</script>
